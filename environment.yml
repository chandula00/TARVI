# TARVI conda environment (Python 3.10, CUDA 12.8, PyTorch 2.10)
#
# Create:   conda env create -f environment.yml
# Activate: conda activate tarvi
# Install the package (from the repo root, after activating):
#           pip install -e .

name: tarvi

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  # Core scientific stack
  - numpy>=2.2
  - pandas>=2.3
  - scipy>=1.15
  - scikit-learn>=1.7
  - matplotlib>=3.10
  - seaborn>=0.13
  - networkx>=3.4

  # Graph / clustering
  - leidenalg>=0.11
  - igraph>=1.0

  - pip:
      # PyTorch with CUDA 12.8 (official wheel index; conda-forge lacks cu128 builds)
      - --index-url https://download.pytorch.org/whl/cu128
      - torch==2.10.0+cu128
      - torchvision
      - torchaudio

      # PyTorch ecosystem
      - lightning>=2.6
      - pytorch-lightning>=2.6
      - torchmetrics>=1.9
      - torchdiffeq>=0.2.5

      # Single-cell core
      - anndata>=0.10.9
      - scanpy>=1.11
      - scvelo>=0.3.4

      # RNA velocity backbones / baselines
      - scvi-tools>=1.3.3        # VeloVI backbone
      - unitvelo>=0.2.5.2
      - sctour>=1.0.0
