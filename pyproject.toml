[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tarvi"
version = "0.1.0"
description = "TARVI: Transcription-Factor Aided RNA Velocity Inference"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Chandula Adhikari" },
    { name = "Sandeep Dassanayake" },
    { name = "Damayanthi Herath" },
]
keywords = [
    "rna-velocity",
    "single-cell",
    "scRNA-seq",
    "variational-autoencoder",
    "transcription-factor",
    "pseudotime",
]

# Full pinned environment lives in environment.yml (conda + pip).
# Only the hard minimums are listed here so `pip install -e .` stays lightweight.
dependencies = [
    "scvi-tools>=1.3",
    "scvelo>=0.3",
    "torch>=2.0",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "anndata",
    "scanpy",
]

[project.urls]
Repository = "https://github.com/chandula00/TARVI"

[tool.setuptools.packages.find]
where = ["."]
include = ["tarvi*", "evaluation*"]
